pre-commit:
  commands:
    eslint:
      glob: '*.{js,ts,cjs,mjs,jsx,tsx}'
      run: pnpm eslint --fix {staged_files}
      stage_fixed: true

    prettier:
      glob: '*.{js,ts,cjs,mjs,jsx,tsx,json,jsonc,css,scss,md,yml,yaml}'
      run: pnpm prettier --write {staged_files}
      stage_fixed: true
